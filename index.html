    // Paleta de badges distintos por analista
    const ANALYST_BADGE_STYLES = {
      matheus: 'bg-blue-50 text-blue-700 border border-blue-200',
      paula: 'bg-purple-50 text-purple-700 border border-purple-200',
      camila: 'bg-emerald-50 text-emerald-700 border border-emerald-200',
      thiago: 'bg-amber-50 text-amber-800 border border-amber-200',
      vitor: 'bg-indigo-50 text-indigo-700 border border-indigo-200',
    };

    const FALLBACK_BADGES = [
      'bg-sky-50 text-sky-700 border border-sky-200',
      'bg-teal-50 text-teal-700 border border-teal-200',
      'bg-rose-50 text-rose-700 border border-rose-200',

    // Normaliza texto removendo acentos e convertendo para minúsculas
    function normalizeText(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim();
    }

    // Extrai apenas dígitos numéricos (para comparação de CNPJ)
    function onlyDigits(value) {
      return String(value || '').replace(/\D/g, '');
    }

    // Formata CNPJ de 14 dígitos no padrão 00.000.000/0000-00
    function formatCNPJ(raw) {
      const digits = onlyDigits(raw);
      if (digits.length === 14) {
        return digits.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
      }
      return raw && raw !== '-' ? raw : '—';
    }

    // Escapa caracteres especiais para evitar quebra de HTML
    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Retorna as classes de cor do badge de acordo com o analista
    function getAnalystBadgeClass(analystName, index = 0) {
      const key = normalizeText(analystName);
      return ANALYST_BADGE_STYLES[key] || FALLBACK_BADGES[index % FALLBACK_BADGES.length];
    }

    // Copia texto para a área de transferência de forma compatível com iframes e navegadores modernos
    function copyToClipboard(text, label) {
      try {
        const tempInput = document.createElement('textarea');
        tempInput.value = text;
        tempInput.setAttribute('readonly', '');
        tempInput.style.position = 'fixed';
        tempInput.style.opacity = '0';
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        showToast(`${label} copiado: ${text}`);
      } catch (_) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            showToast(`${label} copiado: ${text}`);
          });
        }
      }
    }

    function showToast(message) {
      const toast = document.getElementById('copyToast');
      const toastText = document.getElementById('copyToastText');
      toastText.textContent = message;
      toast.classList.remove('opacity-0', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-2');
      }, 1800);
    }

    // Prepara os dados em memória e atualiza toda a interface
    function setDataset(rawContas, rawTenants) {
      contasData = rawContas.map(item => ({
        cliente: String(item.cliente || '').trim(),
        analista: String(item.analista || '').trim(),
        clienteNorm: normalizeText(item.cliente),
        analistaNorm: normalizeText(item.analista),
      }));

      tenantsData = rawTenants.map(row => {
        const ambiente = String(row['Ambiente'] || row['ambiente'] || '').trim();
        const tenantId = String(row['TenantID'] || row['tenantId'] || row['TenantId'] || '').trim();
        const nome = String(row['Nome Tenant'] || row['nome'] || '').trim();
        const cnpjRaw = String(row['CNPJ'] || row['cnpj'] || '').trim();
        return {
          ambiente: ambiente || '—',
          tenantId,
          nome,
          cnpjRaw,
          cnpjDigits: onlyDigits(cnpjRaw),
          nomeNorm: normalizeText(nome),
          tenantIdNorm: normalizeText(tenantId),
        };
      });

      selectedAnalyst = 'TODOS';
      document.getElementById('tabCountContas').textContent = contasData.length;
      document.getElementById('tabCountTenants').textContent = tenantsData.length;

      renderAnalystChips();
      renderContas();
      renderTenants();
    }

    // Lê a planilha Excel via SheetJS quando disponível
    function parseWorkbook(arrayBuffer) {
      try {
        if (typeof XLSX === 'undefined') return;
        const wb = XLSX.read(arrayBuffer, { type: 'array' });

        // 1) Aba de Distribuição de Contas (colunas com nome de cada analista)
        const sheetContasName =
          wb.SheetNames.find(n => normalizeText(n).includes('distribuicao')) || wb.SheetNames[0];
        const parsedContas = [];

        if (sheetContasName) {
          const sheetContas = wb.Sheets[sheetContasName];
          const rows = XLSX.utils.sheet_to_json(sheetContas, { header: 1, defval: '' });

          if (rows.length > 1) {
            const analysts = rows[0].map(cell => String(cell || '').trim());
            for (let r = 1; r < rows.length; r++) {
              const row = rows[r];
              for (let c = 0; c < analysts.length; c++) {
                const analista = analysts[c];
                const cliente = String(row[c] || '').trim();
                if (analista && cliente) {
                  parsedContas.push({ cliente, analista });
                }
              }
            }
          }
        }

        // 2) Aba de Buscador de Tenants
        const sheetTenantsName =
          wb.SheetNames.find(n => normalizeText(n).includes('tenant')) || wb.SheetNames[1];
        let parsedTenants = [];

        if (sheetTenantsName) {
          const sheetTenants = wb.Sheets[sheetTenantsName];
          parsedTenants = XLSX.utils.sheet_to_json(sheetTenants, { raw: false, defval: '' });
        }

        if (parsedContas.length > 0 || parsedTenants.length > 0) {
          setDataset(parsedContas, parsedTenants);
        }
      } catch (_) {
        // Fallback silencioso mantido
      }
    }

    // Renderiza os chips de filtro rápido por analista
    function renderAnalystChips() {
      const container = document.getElementById('analystChips');
      const counts = {};
      const order = [];

      contasData.forEach(item => {
        if (!counts[item.analista]) {
          counts[item.analista] = 0;
          order.push(item.analista);
        }
        counts[item.analista] += 1;
      });

      const isAll = selectedAnalyst === 'TODOS';
      let html = `
        <button
          type="button"
          data-analyst="TODOS"
          class="analyst-chip inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all ${
            isAll
              ? 'bg-brand-600 text-white shadow-sm'
              : 'bg-slate-100 text-slate-700 hover:bg-slate-200/80'
          }"
        >
          <span>Todos</span>
          <span class="px-1.5 py-0.2 rounded-full text-[11px] font-semibold ${
            isAll ? 'bg-white/20 text-white' : 'bg-white text-slate-600'
          }">${contasData.length}</span>
        </button>
      `;

      order.forEach((analyst, idx) => {
        const active = selectedAnalyst === analyst;
        const dotColors = ['bg-blue-500', 'bg-purple-500', 'bg-emerald-500', 'bg-amber-500', 'bg-indigo-500'];
        const dotColor = dotColors[idx % dotColors.length];

        html += `
          <button
            type="button"
            data-analyst="${escapeHTML(analyst)}"
            class="analyst-chip inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all ${
              active
                ? 'bg-brand-600 text-white shadow-sm'
                : 'bg-white border border-[#e2e8f0] text-slate-700 hover:bg-slate-50'
            }"
          >
            <span class="w-2 h-2 rounded-full ${active ? 'bg-white' : dotColor}"></span>
            <span>${escapeHTML(analyst)}</span>
            <span class="px-1.5 py-0.2 rounded-full text-[11px] font-semibold ${
              active ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-600'
            }">${counts[analyst]}</span>
          </button>
        `;
      });

      container.innerHTML = html;
      container.querySelectorAll('.analyst-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedAnalyst = btn.dataset.analyst;
          renderAnalystChips();
          renderContas();
        });
      });
    }

    // Filtra e renderiza a tabela da Aba 1 (Distribuição de Contas)
    function renderContas() {
      const inputEl = document.getElementById('searchContas');
      const clearBtn = document.getElementById('clearContas');
      const term = normalizeText(inputEl.value);

      clearBtn.classList.toggle('hidden', inputEl.value.length === 0);

      const filtered = contasData.filter(item => {
        const matchAnalyst = selectedAnalyst === 'TODOS' || item.analista === selectedAnalyst;
        const matchSearch =
          !term || item.clienteNorm.includes(term) || item.analistaNorm.includes(term);
        return matchAnalyst && matchSearch;
      });

      document.getElementById('metaContas').textContent = `${filtered.length} resultado(s) encontrado(s)`;

      const tbody = document.getElementById('tbodyContas');
      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="2" class="py-10 px-4 text-center text-slate-400">
              Nenhuma conta ou analista encontrado para a busca informada.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered
        .map((item, idx) => {
          const badgeClass = getAnalystBadgeClass(item.analista, idx);
          return `
            <tr class="hover:bg-slate-50/90 transition-colors">
              <td class="py-3.5 px-4 sm:px-5 font-medium text-slate-900">${escapeHTML(item.cliente)}</td>
              <td class="py-3.5 px-4 sm:px-5">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold ${badgeClass}">
                  ${escapeHTML(item.analista)}
                </span>
              </td>
            </tr>
          `;
        })
        .join('');
    }

    // Filtra e renderiza a tabela da Aba 2 (Buscador de Tenants)
    function renderTenants() {
      const inputEl = document.getElementById('searchTenants');
      const clearBtn = document.getElementById('clearTenants');
      const rawQuery = inputEl.value;
      const term = normalizeText(rawQuery);
      const termDigits = onlyDigits(rawQuery);

      clearBtn.classList.toggle('hidden', rawQuery.length === 0);

      const filtered = tenantsData.filter(item => {
        if (!term && !termDigits) return true;
        const matchNome = term.length > 0 && item.nomeNorm.includes(term);
        const matchId = term.length > 0 && item.tenantIdNorm.includes(term);
        const matchCnpj = termDigits.length > 0 && item.cnpjDigits.includes(termDigits);
        return matchNome || matchId || matchCnpj;
      });

      const visible = filtered.slice(0, MAX_TENANT_ROWS);
      document.getElementById('metaTenants').textContent =
        filtered.length > MAX_TENANT_ROWS
          ? `Exibindo ${MAX_TENANT_ROWS} de ${filtered.length} resultado(s) encontrado(s)`
          : `${filtered.length} resultado(s) encontrado(s)`;

      const tbody = document.getElementById('tbodyTenants');
      if (visible.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="py-10 px-4 text-center text-slate-400">
              Nenhum Tenant encontrado para o nome, TenantID ou CNPJ informado.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = visible
        .map(item => {
          const cnpjFormatted = formatCNPJ(item.cnpjRaw);
          const hasValidCnpj = item.cnpjDigits.length > 0;

          return `
            <tr class="hover:bg-slate-50/90 transition-colors">
              <td class="py-3.5 px-4 whitespace-nowrap">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200">
                  ${escapeHTML(item.ambiente)}
                </span>
              </td>
              <td class="py-3.5 px-4 whitespace-nowrap">
                <div class="inline-flex items-center gap-2">
                  <span class="font-semibold text-slate-900 font-mono">${escapeHTML(item.tenantId)}</span>
                  <button
                    type="button"
                    data-copy="${escapeHTML(item.tenantId)}"
                    data-label="TenantID"
                    class="copy-action px-2 py-1 text-xs font-medium rounded-lg border border-slate-200 bg-white text-slate-600 hover:text-brand-600 hover:border-brand-300 hover:bg-brand-50/50 transition-colors"
                  >
                    Copiar
                  </button>
                </div>
              </td>
              <td class="py-3.5 px-4 font-medium text-slate-900">${escapeHTML(item.nome)}</td>
              <td class="py-3.5 px-4 whitespace-nowrap">
                ${
                  hasValidCnpj
                    ? `<div class="inline-flex items-center gap-2">
                        <span class="font-mono text-slate-700">${escapeHTML(cnpjFormatted)}</span>
                        <button
                          type="button"
                          data-copy="${escapeHTML(item.cnpjDigits)}"
                          data-label="CNPJ"
                          class="copy-action px-2 py-1 text-xs font-medium rounded-lg border border-slate-200 bg-white text-slate-600 hover:text-brand-600 hover:border-brand-300 hover:bg-brand-50/50 transition-colors"
                        >
                          Copiar
                        </button>
                      </div>`
                    : `<span class="text-slate-400">—</span>`
                }
              </td>
            </tr>
          `;
        })
        .join('');
    }

    // Alternância de abas
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.tab;

        document.querySelectorAll('.tab-btn').forEach(b => {
          const isCurrent = b.dataset.tab === target;
          b.classList.toggle('active', isCurrent);
          b.classList.toggle('border-brand-600', isCurrent);
          b.classList.toggle('text-brand-600', isCurrent);
          b.classList.toggle('bg-white', isCurrent);
          b.classList.toggle('border-transparent', !isCurrent);
          b.classList.toggle('text-slate-500', !isCurrent);

          const badge = b.querySelector('span:last-child');
          if (badge) {
            badge.className = isCurrent
              ? 'text-xs font-semibold px-2 py-0.5 rounded-full bg-brand-50 text-brand-700'
              : 'text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-200/80 text-slate-700';
          }
        });

        document.getElementById('panel-contas').classList.toggle('hidden', target !== 'contas');
        document.getElementById('panel-tenants').classList.toggle('hidden', target !== 'tenants');
      });
    });

    // Delegação de clique para botões de copiar na tabela de Tenants
    document.getElementById('tbodyTenants').addEventListener('click', e => {
      const btn = e.target.closest('.copy-action');
      if (!btn) return;
      copyToClipboard(btn.dataset.copy, btn.dataset.label);
    });

    // Eventos de busca em tempo real e limpeza
    document.getElementById('searchContas').addEventListener('input', renderContas);
    document.getElementById('clearContas').addEventListener('click', () => {
      const el = document.getElementById('searchContas');
      el.value = '';
      el.focus();
      renderContas();
    });

    document.getElementById('searchTenants').addEventListener('input', renderTenants);
    document.getElementById('clearTenants').addEventListener('click', () => {
      const el = document.getElementById('searchTenants');
      el.value = '';
      el.focus();
      renderTenants();
    });

    // Inicializa com os dados embutidos e tenta carregar ./Fila WEB.xlsx automaticamente no GitHub Pages
    async function initApp() {
      setDataset(CONTAS, TENANTS);

      try {
        const res = await fetch(encodeURI(EXCEL_DEFAULT_PATH) + '?v=' + Date.now());
        if (res.ok) {
          const contentType = res.headers.get('content-type') || '';
          if (!contentType.includes('text/html')) {
            const buffer = await res.arrayBuffer();
            parseWorkbook(buffer);
          }
        }
      } catch (_) {
        // Em ambientes sem ./Fila WEB.xlsx, mantém os dados embutidos silenciosamente
      }
    }

    initApp();
  </script>
</body>
</html>
