<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Divisão Filas Web Compartilhado</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fonte Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Biblioteca SheetJS para leitura automática da planilha Excel no GitHub Pages -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-[#f8fafc] text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- Cabeçalho limpo: apenas título e subtítulo -->
  <header class="bg-white border-b border-[#e2e8f0] sticky top-0 z-20 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center shrink-0 shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight">Divisão Filas Web Compartilhado</h1>
          <p class="text-xs sm:text-sm text-slate-500 mt-0.5">
            Consulta rápida de distribuição de contas
          </p>
        </div>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1">
    <div class="bg-white rounded-2xl border border-[#e2e8f0] shadow-sm overflow-hidden">

      <!-- Seção de Distribuição de Contas -->
      <section id="panel-contas" class="p-4 sm:p-6">
        <!-- Campo de Busca -->
        <div class="relative mb-4">
          <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
          <input
            type="text"
            id="searchContas"
            placeholder="Digite as iniciais ou parte do nome da conta ou do analista (ex: Gru, Vit, Soma, TNG)..."
            autocomplete="off"
            class="w-full pl-11 pr-20 py-3.5 text-sm sm:text-base bg-white border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-brand-600 focus:ring-4 focus:ring-brand-500/15 transition-all"
          />
          <button
            id="clearContas"
            type="button"
            title="Limpar busca"
            class="hidden absolute inset-y-0 right-2 my-auto h-8 px-2.5 rounded-lg text-xs font-medium text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition-colors"
          >
            Limpar
          </button>
        </div>

        <!-- Filtros rápidos por Analista -->
        <div class="mb-4">
          <div class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Filtrar por analista</div>
          <div id="analystChips" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Contador de resultados -->
        <div class="flex items-center justify-between text-xs sm:text-sm text-slate-500 mb-3">
          <span id="metaContas">0 resultado(s) encontrado(s)</span>
        </div>

        <!-- Tabela de Resultados -->
        <div class="overflow-x-auto rounded-xl border border-[#e2e8f0]">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50 border-b border-[#e2e8f0] text-xs font-semibold uppercase tracking-wider text-slate-500">
                <th class="py-3.5 px-4 sm:px-5">Cliente / Conta</th>
                <th class="py-3.5 px-4 sm:px-5 w-48 sm:w-56">Analista Responsável</th>
              </tr>
            </thead>
            <tbody id="tbodyContas" class="divide-y divide-[#e2e8f0] text-sm"></tbody>
          </table>
        </div>
      </section>

    </div>
  </main>

  <script>
    // Caminho relativo da planilha no repositório GitHub Pages
    const EXCEL_DEFAULT_PATH = './Fila WEB.xlsx';

    // Dados reais embutidos como fallback silencioso para pré-visualização
    const CONTAS = [
      {"cliente": "Adriana Degreas", "analista": "Matheus"},
      {"cliente": "Ateen Moda Feminina", "analista": "Matheus"},
      {"cliente": "AUSTRAL CULTURE", "analista": "Matheus"},
      {"cliente": "BALI HAI - RETAGUARDA PARANA", "analista": "Matheus"},
      {"cliente": "Bayard", "analista": "Matheus"},
      {"cliente": "Criari", "analista": "Matheus"},
      {"cliente": "D MANO CONFECCOES", "analista": "Matheus"},
      {"cliente": "DEUS EX MACHINA", "analista": "Matheus"},
      {"cliente": "Bomache", "analista": "Paula"},
      {"cliente": "CAVALERA", "analista": "Paula"},
      {"cliente": "D MANO CONFECCOES - R", "analista": "Paula"},
      {"cliente": "D.R. LING", "analista": "Paula"},
      {"cliente": "ELOETH", "analista": "Paula"},
      {"cliente": "FATIOTA", "analista": "Paula"},
      {"cliente": "Fit web", "analista": "Paula"},
      {"cliente": "FORUM", "analista": "Paula"},
      {"cliente": "AESOP (NATURA)", "analista": "Camila"},
      {"cliente": "ANDRIELLO", "analista": "Camila"},
      {"cliente": "Any Any", "analista": "Camila"},
      {"cliente": "Calzedonia", "analista": "Camila"},
      {"cliente": "Citerol", "analista": "Camila"},
      {"cliente": "Reserva", "analista": "Camila"},
      {"cliente": "CORELLO", "analista": "Camila"},
      {"cliente": "DRILL", "analista": "Camila"},
      {"cliente": "TNG", "analista": "Thiago"},
      {"cliente": "Agilita", "analista": "Thiago"},
      {"cliente": "Anjuss", "analista": "Thiago"},
      {"cliente": "Aramis", "analista": "Thiago"},
      {"cliente": "ARTY MODAS", "analista": "Thiago"},
      {"cliente": "Blueman", "analista": "Thiago"},
      {"cliente": "BROCKTON", "analista": "Thiago"},
      {"cliente": "Dorinhos", "analista": "Thiago"},
      {"cliente": "BUCKMAN", "analista": "Vitor"},
      {"cliente": "COTTON ON", "analista": "Vitor"},
      {"cliente": "DEBRUM", "analista": "Vitor"},
      {"cliente": "Grupo Soma", "analista": "Vitor"},
      {"cliente": "HAIGHT", "analista": "Vitor"},
      {"cliente": "Inovathi", "analista": "Vitor"},
      {"cliente": "Kyly", "analista": "Vitor"},
      {"cliente": "LAFORT", "analista": "Vitor"}
    ];

    // Paleta de badges distintos por analista
    const ANALYST_BADGE_STYLES = {
      matheus: 'bg-blue-50 text-blue-700 border border-blue-200',
      paula: 'bg-purple-50 text-purple-700 border border-purple-200',
      camila: 'bg-emerald-50 text-emerald-700 border border-emerald-200',
      thiago: 'bg-amber-50 text-amber-800 border border-amber-200',
      vitor: 'bg-indigo-50 text-indigo-700 border border-indigo-200',
    };

    const FALLBACK_BADGES = [
      'bg-sky-50 text-sky-700 border border-sky-200',
      'bg-teal-50 text-teal-700 border border-teal-200',
      'bg-rose-50 text-rose-700 border border-rose-200',
      'bg-cyan-50 text-cyan-700 border border-cyan-200',
    ];

    let contasData = [];
    let selectedAnalyst = 'TODOS';

    // Normaliza texto removendo acentos e convertendo para minúsculas
    function normalizeText(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim();
    }

    // Escapa caracteres especiais para evitar quebra de HTML
    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Retorna as classes de cor do badge de acordo com o analista
    function getAnalystBadgeClass(analystName, index = 0) {
      const key = normalizeText(analystName);
      return ANALYST_BADGE_STYLES[key] || FALLBACK_BADGES[index % FALLBACK_BADGES.length];
    }

    // Prepara os dados em memória e atualiza a interface
    function setDataset(rawContas) {
      contasData = rawContas.map(item => ({
        cliente: String(item.cliente || '').trim(),
        analista: String(item.analista || '').trim(),
        clienteNorm: normalizeText(item.cliente),
        analistaNorm: normalizeText(item.analista),
      }));

      selectedAnalyst = 'TODOS';
      renderAnalystChips();
      renderContas();
    }

    // Lê a aba 'DISTRIBUIÇÃO DE CONTAS WEB' da planilha Excel via SheetJS
    function parseWorkbook(arrayBuffer) {
      try {
        if (typeof XLSX === 'undefined') return;
        const wb = XLSX.read(arrayBuffer, { type: 'array' });

        const sheetContasName =
          wb.SheetNames.find(n => normalizeText(n).includes('distribuicao')) || wb.SheetNames[0];
        const parsedContas = [];

        if (sheetContasName) {
          const sheetContas = wb.Sheets[sheetContasName];
          const rows = XLSX.utils.sheet_to_json(sheetContas, { header: 1, defval: '' });

          if (rows.length > 1) {
            const analysts = rows[0].map(cell => String(cell || '').trim());
            for (let r = 1; r < rows.length; r++) {
              const row = rows[r];
              for (let c = 0; c < analysts.length; c++) {
                const analista = analysts[c];
                const cliente = String(row[c] || '').trim();
                if (analista && cliente) {
                  parsedContas.push({ cliente, analista });
                }
              }
            }
          }
        }

        if (parsedContas.length > 0) {
          setDataset(parsedContas);
        }
      } catch (_) {
        // Fallback silencioso mantido
      }
    }

    // Renderiza os chips de filtro rápido por analista
    function renderAnalystChips() {
      const container = document.getElementById('analystChips');
      const counts = {};
      const order = [];

      contasData.forEach(item => {
        if (!counts[item.analista]) {
          counts[item.analista] = 0;
          order.push(item.analista);
        }
        counts[item.analista] += 1;
      });

      const isAll = selectedAnalyst === 'TODOS';
      let html = `
        <button
          type="button"
          data-analyst="TODOS"
          class="analyst-chip inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all ${
            isAll
              ? 'bg-brand-600 text-white shadow-sm'
              : 'bg-slate-100 text-slate-700 hover:bg-slate-200/80'
          }"
        >
          <span>Todos</span>
          <span class="px-1.5 py-0.5 rounded-full text-[11px] font-semibold ${
            isAll ? 'bg-white/20 text-white' : 'bg-white text-slate-600'
          }">${contasData.length}</span>
        </button>
      `;

      order.forEach((analyst, idx) => {
        const active = selectedAnalyst === analyst;
        const dotColors = ['bg-blue-500', 'bg-purple-500', 'bg-emerald-500', 'bg-amber-500', 'bg-indigo-500'];
        const dotColor = dotColors[idx % dotColors.length];

        html += `
          <button
            type="button"
            data-analyst="${escapeHTML(analyst)}"
            class="analyst-chip inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all ${
              active
                ? 'bg-brand-600 text-white shadow-sm'
                : 'bg-white border border-[#e2e8f0] text-slate-700 hover:bg-slate-50'
            }"
          >
            <span class="w-2 h-2 rounded-full ${active ? 'bg-white' : dotColor}"></span>
            <span>${escapeHTML(analyst)}</span>
            <span class="px-1.5 py-0.5 rounded-full text-[11px] font-semibold ${
              active ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-600'
            }">${counts[analyst]}</span>
          </button>
        `;
      });

      container.innerHTML = html;
      container.querySelectorAll('.analyst-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedAnalyst = btn.dataset.analyst;
          renderAnalystChips();
          renderContas();
        });
      });
    }

    // Filtra e renderiza a tabela de Distribuição de Contas
    function renderContas() {
      const inputEl = document.getElementById('searchContas');
      const clearBtn = document.getElementById('clearContas');
      const term = normalizeText(inputEl.value);

      clearBtn.classList.toggle('hidden', inputEl.value.length === 0);

      const filtered = contasData.filter(item => {
        const matchAnalyst = selectedAnalyst === 'TODOS' || item.analista === selectedAnalyst;
        const matchSearch =
          !term || item.clienteNorm.includes(term) || item.analistaNorm.includes(term);
        return matchAnalyst && matchSearch;
      });

      document.getElementById('metaContas').textContent = `${filtered.length} resultado(s) encontrado(s)`;

      const tbody = document.getElementById('tbodyContas');
      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="2" class="py-10 px-4 text-center text-slate-400">
              Nenhuma conta ou analista encontrado para a busca informada.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered
        .map((item, idx) => {
          const badgeClass = getAnalystBadgeClass(item.analista, idx);
          return `
            <tr class="hover:bg-slate-50/90 transition-colors">
              <td class="py-3.5 px-4 sm:px-5 font-medium text-slate-900">${escapeHTML(item.cliente)}</td>
              <td class="py-3.5 px-4 sm:px-5">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold ${badgeClass}">
                  ${escapeHTML(item.analista)}
                </span>
              </td>
            </tr>
          `;
        })
        .join('');
    }

    // Eventos de busca em tempo real e limpeza
    document.getElementById('searchContas').addEventListener('input', renderContas);
    document.getElementById('clearContas').addEventListener('click', () => {
      const el = document.getElementById('searchContas');
      el.value = '';
      el.focus();
      renderContas();
    });

    // Inicializa com os dados embutidos e tenta carregar ./Fila WEB.xlsx automaticamente no GitHub Pages
    async function initApp() {
      setDataset(CONTAS);

      try {
        const res = await fetch(encodeURI(EXCEL_DEFAULT_PATH) + '?v=' + Date.now());
        if (res.ok) {
          const contentType = res.headers.get('content-type') || '';
          if (!contentType.includes('text/html')) {
            const buffer = await res.arrayBuffer();
            parseWorkbook(buffer);
          }
        }
      } catch (_) {
        // Em ambientes sem ./Fila WEB.xlsx, mantém os dados embutidos silenciosamente
      }
    }

    initApp();
  </script>
</body>
</html>
